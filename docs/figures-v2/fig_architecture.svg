<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="100%" role="img" aria-label="The four v2 layers sit on top of the v1 engine" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif"><rect width="900" height="400" fill="#fff"/><rect x="60" y="292" width="780" height="84" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.2"/><text x="450.0" y="314" text-anchor="middle" font-size="12.5" font-weight="650" fill="#0f172a">v1 core (unchanged): one clerk pool, stationary Poisson arrivals, fixed service times</text><text x="450.0" y="329" text-anchor="middle" font-size="10.5" fill="#64748b">2x2 policy matrix: split vs synchronised delivery  x  fast-item priority vs FCFS</text><text x="450.0" y="344" text-anchor="middle" font-size="10.5" fill="#64748b">200 replicates per cell, common random numbers, 480-minute day with 60-minute warm-up</text><rect x="60" y="168" width="185" height="96" rx="10" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.2"/><text x="152.5" y="190" text-anchor="middle" font-size="13" font-weight="650" fill="#0f172a">1 · Demand</text><text x="152.5" y="205" text-anchor="middle" font-size="10.5" fill="#64748b">intra-day profile</text><text x="152.5" y="220" text-anchor="middle" font-size="10.5" fill="#64748b">batch arrivals</text><text x="152.5" y="235" text-anchor="middle" font-size="10.5" fill="#64748b">customer classes</text><text x="152.5" y="250" text-anchor="middle" font-size="10.5" fill="#64748b">patience (balk/renege)</text><rect x="250" y="168" width="185" height="96" rx="10" fill="#fff7ed" stroke="#d97706" stroke-width="1.2"/><text x="342.5" y="190" text-anchor="middle" font-size="13" font-weight="650" fill="#0f172a">2 · Supply network</text><text x="342.5" y="205" text-anchor="middle" font-size="10.5" fill="#64748b">stations + capacity</text><text x="342.5" y="220" text-anchor="middle" font-size="10.5" fill="#64748b">staff skills</text><text x="342.5" y="235" text-anchor="middle" font-size="10.5" fill="#64748b">shift windows, breaks</text><text x="342.5" y="250" text-anchor="middle" font-size="10.5" fill="#64748b">routing per component</text><rect x="440" y="168" width="185" height="96" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.2"/><text x="532.5" y="190" text-anchor="middle" font-size="13" font-weight="650" fill="#0f172a">3 · Inventory / BOM</text><text x="532.5" y="205" text-anchor="middle" font-size="10.5" fill="#64748b">(s, S) replenishment</text><text x="532.5" y="220" text-anchor="middle" font-size="10.5" fill="#64748b">lead time</text><text x="532.5" y="235" text-anchor="middle" font-size="10.5" fill="#64748b">shelf life, waste</text><text x="532.5" y="250" text-anchor="middle" font-size="10.5" fill="#64748b">stock-out policy</text><rect x="630" y="168" width="210" height="96" rx="10" fill="#fef2f2" stroke="#be123c" stroke-width="1.2"/><text x="735.0" y="190" text-anchor="middle" font-size="13" font-weight="650" fill="#0f172a">4 · Economics / fairness</text><text x="735.0" y="205" text-anchor="middle" font-size="10.5" fill="#64748b">time-of-day pricing</text><text x="735.0" y="220" text-anchor="middle" font-size="10.5" fill="#64748b">demand elasticity</text><text x="735.0" y="235" text-anchor="middle" font-size="10.5" fill="#64748b">SLA compensation</text><text x="735.0" y="250" text-anchor="middle" font-size="10.5" fill="#64748b">starvation cap</text><line x1="152" y1="264" x2="152" y2="292" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#arrow)"/><line x1="342" y1="264" x2="342" y2="292" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#arrow)"/><line x1="532" y1="264" x2="532" y2="292" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#arrow)"/><line x1="735" y1="264" x2="735" y2="292" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#arrow)"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#94a3b8"/></marker></defs><text x="60" y="145" font-size="12" font-weight="650" fill="#0f172a">Optional layers (each is off by default; every layer is a frozen, hashable spec object)</text><text x="60" y="60" font-size="14" font-weight="650" fill="#0f172a">One engine, four optional layers, one legacy-compatible core</text><text x="60" y="82" font-size="11.5" fill="#64748b">A configuration with no layer enabled reproduces the v1 model bit-for-bit (pinned by tests/test_v2_layers.py)</text><text x="60" y="120" font-size="11.5" fill="#64748b">Scenario JSON (data/scenarios/*.json) → SimConfig → discrete-event engine → metrics + trace</text></svg>
