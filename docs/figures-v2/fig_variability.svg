<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="100%" role="img" aria-label="p95 time in system by service-time variability and load" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif"><rect x="0" y="0" width="900" height="340" fill="#ffffff"/><text x="68" y="22" font-size="14.5" font-weight="650" fill="#0f172a">Make-time variability moves the tail, not the mean</text><line x1="68" y1="269.4" x2="876" y2="269.4" stroke="#e2e8f0" stroke-width="1"/><text x="59" y="273.4" text-anchor="end" font-size="11" fill="#64748b">0</text><line x1="68" y1="209.5" x2="876" y2="209.5" stroke="#e2e8f0" stroke-width="1"/><text x="59" y="213.5" text-anchor="end" font-size="11" fill="#64748b">5.00</text><line x1="68" y1="149.6" x2="876" y2="149.6" stroke="#e2e8f0" stroke-width="1"/><text x="59" y="153.6" text-anchor="end" font-size="11" fill="#64748b">10.0</text><line x1="68" y1="89.7" x2="876" y2="89.7" stroke="#e2e8f0" stroke-width="1"/><text x="59" y="93.7" text-anchor="end" font-size="11" fill="#64748b">15.0</text><line x1="68" y1="64" x2="68" y2="276" stroke="#94a3b8" stroke-width="1"/><line x1="68" y1="269.4" x2="876" y2="269.4" stroke="#94a3b8" stroke-width="1.2"/><text transform="translate(16,170.0) rotate(-90)" text-anchor="middle" font-size="12" fill="#0f172a">p95 time in system (min)</text><text x="68" y="334" font-size="10.5" fill="#64748b">The engine forces exponential sampling (CV = 1) whenever the variability kind is exponential; the lognormal cells set their CV explicitly.</text><text x="148.8" y="294" text-anchor="middle" font-size="10.5" fill="#64748b">fixed</text><rect x="91.8" y="203.8" width="55.8" height="65.6" fill="#0284c7" rx="1.5" opacity="0.92"><title>fixed | λ = 1.0 = 5.5 min</title></rect><rect x="150.0" y="166.4" width="55.8" height="103.0" fill="#b45309" rx="1.5" opacity="0.92"><title>fixed | λ = 1.2 = 8.6 min</title></rect><text x="310.4" y="294" text-anchor="middle" font-size="10.5" fill="#64748b">exponential (CV 1)</text><rect x="253.4" y="148.4" width="55.8" height="121.0" fill="#0284c7" rx="1.5" opacity="0.92"><title>exponential (CV 1) | λ = 1.0 = 10.1 min</title></rect><rect x="311.6" y="86.0" width="55.8" height="183.4" fill="#b45309" rx="1.5" opacity="0.92"><title>exponential (CV 1) | λ = 1.2 = 15.3 min</title></rect><text x="472.0" y="294" text-anchor="middle" font-size="10.5" fill="#64748b">lognormal CV .25</text><rect x="415.0" y="201.0" width="55.8" height="68.4" fill="#0284c7" rx="1.5" opacity="0.92"><title>lognormal CV .25 | λ = 1.0 = 5.7 min</title></rect><rect x="473.2" y="165.0" width="55.8" height="104.4" fill="#b45309" rx="1.5" opacity="0.92"><title>lognormal CV .25 | λ = 1.2 = 8.7 min</title></rect><text x="633.6" y="294" text-anchor="middle" font-size="10.5" fill="#64748b">lognormal CV .50</text><rect x="576.6" y="192.7" width="55.8" height="76.7" fill="#0284c7" rx="1.5" opacity="0.92"><title>lognormal CV .50 | λ = 1.0 = 6.4 min</title></rect><rect x="634.8" y="156.0" width="55.8" height="113.4" fill="#b45309" rx="1.5" opacity="0.92"><title>lognormal CV .50 | λ = 1.2 = 9.5 min</title></rect><text x="795.2" y="294" text-anchor="middle" font-size="10.5" fill="#64748b">lognormal CV .75</text><rect x="738.2" y="181.4" width="55.8" height="88.0" fill="#0284c7" rx="1.5" opacity="0.92"><title>lognormal CV .75 | λ = 1.0 = 7.3 min</title></rect><rect x="796.4" y="140.6" width="55.8" height="128.8" fill="#b45309" rx="1.5" opacity="0.92"><title>lognormal CV .75 | λ = 1.2 = 10.8 min</title></rect><rect x="68.0" y="45" width="10" height="10" rx="2" fill="#0284c7"/><text x="82.0" y="54" font-size="10.5" fill="#0f172a">λ = 1.0</text><rect x="123.8" y="45" width="10" height="10" rx="2" fill="#b45309"/><text x="137.8" y="54" font-size="10.5" fill="#0f172a">λ = 1.2</text></svg>
