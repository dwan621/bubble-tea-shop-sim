<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="100%" role="img" aria-label="Tea station and barista pool utilisation by capacity" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif"><rect x="0" y="0" width="880" height="300" fill="#ffffff"/><text x="70" y="22" font-size="14.5" font-weight="650" fill="#0f172a">Where the constraint sits at λ = 1.2: the tea station stops being the binding resource</text><line x1="70" y1="239.0" x2="709" y2="239.0" stroke="#e2e8f0" stroke-width="1"/><text x="61" y="243.0" text-anchor="end" font-size="11" fill="#64748b">40%</text><line x1="70" y1="180.0" x2="709" y2="180.0" stroke="#e2e8f0" stroke-width="1"/><text x="61" y="184.0" text-anchor="end" font-size="11" fill="#64748b">60%</text><line x1="70" y1="121.0" x2="709" y2="121.0" stroke="#e2e8f0" stroke-width="1"/><text x="61" y="125.0" text-anchor="end" font-size="11" fill="#64748b">80%</text><line x1="70" y1="62.0" x2="709" y2="62.0" stroke="#e2e8f0" stroke-width="1"/><text x="61" y="66.0" text-anchor="end" font-size="11" fill="#64748b">100%</text><line x1="176.5" y1="244" x2="176.5" y2="249" stroke="#94a3b8" stroke-width="1"/><text x="176.5" y="263" text-anchor="middle" font-size="11" fill="#64748b">1</text><line x1="336.2" y1="244" x2="336.2" y2="249" stroke="#94a3b8" stroke-width="1"/><text x="336.2" y="263" text-anchor="middle" font-size="11" fill="#64748b">2</text><line x1="496.0" y1="244" x2="496.0" y2="249" stroke="#94a3b8" stroke-width="1"/><text x="496.0" y="263" text-anchor="middle" font-size="11" fill="#64748b">3</text><line x1="655.8" y1="244" x2="655.8" y2="249" stroke="#94a3b8" stroke-width="1"/><text x="655.8" y="263" text-anchor="middle" font-size="11" fill="#64748b">3</text><line x1="70" y1="44" x2="70" y2="244" stroke="#94a3b8" stroke-width="1"/><line x1="70" y1="244" x2="709" y2="244" stroke="#94a3b8" stroke-width="1"/><text x="389.5" y="282" text-anchor="middle" font-size="12" fill="#0f172a">tea stations (fixed labour: one barista per station)</text><text transform="translate(16,144.0) rotate(-90)" text-anchor="middle" font-size="12" fill="#0f172a">utilisation</text><text x="70" y="295" font-size="10.5" fill="#64748b">The dashed vertical line marks the critical capacity the study computes from paired marginal profit. Beyond it the shared barista pool and the order counter, not the tea station, decide the queue.</text><polyline points="70.0,79.3 283.0,105.5 496.0,181.2 709.0,224.6" fill="none" stroke="#b45309" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="70.0" cy="79.3" r="2.9" fill="#ffffff" stroke="#b45309" stroke-width="1.7"><title>tea station utilisation | 1 -> 94%</title></circle><circle cx="283.0" cy="105.5" r="2.9" fill="#ffffff" stroke="#b45309" stroke-width="1.7"><title>tea station utilisation | 2 -> 85%</title></circle><circle cx="496.0" cy="181.2" r="2.9" fill="#ffffff" stroke="#b45309" stroke-width="1.7"><title>tea station utilisation | 3 -> 60%</title></circle><circle cx="709.0" cy="224.6" r="2.9" fill="#ffffff" stroke="#b45309" stroke-width="1.7"><title>tea station utilisation | 4 -> 45%</title></circle><polyline points="70.0,63.4 283.0,91.4 496.0,171.4 709.0,217.3" fill="none" stroke="#0284c7" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="70.0" cy="63.4" r="2.9" fill="#ffffff" stroke="#0284c7" stroke-width="1.7"><title>barista pool utilisation | 1 -> 100%</title></circle><circle cx="283.0" cy="91.4" r="2.9" fill="#ffffff" stroke="#0284c7" stroke-width="1.7"><title>barista pool utilisation | 2 -> 90%</title></circle><circle cx="496.0" cy="171.4" r="2.9" fill="#ffffff" stroke="#0284c7" stroke-width="1.7"><title>barista pool utilisation | 3 -> 63%</title></circle><circle cx="709.0" cy="217.3" r="2.9" fill="#ffffff" stroke="#0284c7" stroke-width="1.7"><title>barista pool utilisation | 4 -> 47%</title></circle><line x1="721" y1="50" x2="743" y2="50" stroke="#b45309" stroke-width="2.6"/><text x="747" y="54" font-size="10.5" fill="#0f172a">tea station utilisation</text><line x1="721" y1="70" x2="743" y2="70" stroke="#0284c7" stroke-width="2.6"/><text x="747" y="74" font-size="10.5" fill="#0f172a">barista pool utilisation</text></svg>
