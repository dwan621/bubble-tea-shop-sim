<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="100%" role="img" aria-label="Profit per hour per scenario" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif"><rect x="0" y="0" width="900" height="360" fill="#ffffff"/><text x="68" y="22" font-size="14.5" font-weight="650" fill="#0f172a">Scenario catalogue: profit per hour in each scenario (100 replicates, each scenario's own policy)</text><line x1="68" y1="288.8" x2="876" y2="288.8" stroke="#e2e8f0" stroke-width="1"/><text x="59" y="292.8" text-anchor="end" font-size="11" fill="#64748b">0</text><line x1="68" y1="228.7" x2="876" y2="228.7" stroke="#e2e8f0" stroke-width="1"/><text x="59" y="232.7" text-anchor="end" font-size="11" fill="#64748b">100</text><line x1="68" y1="168.7" x2="876" y2="168.7" stroke="#e2e8f0" stroke-width="1"/><text x="59" y="172.7" text-anchor="end" font-size="11" fill="#64748b">200</text><line x1="68" y1="108.7" x2="876" y2="108.7" stroke="#e2e8f0" stroke-width="1"/><text x="59" y="112.7" text-anchor="end" font-size="11" fill="#64748b">300</text><line x1="68" y1="64" x2="68" y2="296" stroke="#94a3b8" stroke-width="1"/><line x1="68" y1="288.8" x2="876" y2="288.8" stroke="#94a3b8" stroke-width="1.2"/><text transform="translate(16,180.0) rotate(-90)" text-anchor="middle" font-size="12" fill="#0f172a">profit / hour</text><text x="68" y="354" font-size="10.5" fill="#64748b">Each scenario runs with its own configuration and policy, so differences mix context and policy; the rows are a map, not a controlled comparison.</text><text x="93.2" y="314" text-anchor="middle" font-size="10.5" fill="#64748b">baseline flat</text><rect x="76.3" y="124.7" width="34.0" height="164.1" fill="#0f766e" rx="1.5" opacity="0.92"><title>baseline flat | profit per hour = 273</title></rect><text x="143.8" y="314" text-anchor="middle" font-size="10.5" fill="#64748b">bread counter </text><rect x="126.8" y="186.4" width="34.0" height="102.4" fill="#0f766e" rx="1.5" opacity="0.92"><title>bread counter  | profit per hour = 171</title></rect><text x="194.2" y="314" text-anchor="middle" font-size="10.5" fill="#64748b">campus rush</text><rect x="177.3" y="144.6" width="34.0" height="144.1" fill="#0f766e" rx="1.5" opacity="0.92"><title>campus rush | profit per hour = 240</title></rect><text x="244.8" y="314" text-anchor="middle" font-size="10.5" fill="#64748b">cbd commute</text><rect x="227.8" y="140.2" width="34.0" height="148.5" fill="#0f766e" rx="1.5" opacity="0.92"><title>cbd commute | profit per hour = 247</title></rect><text x="295.2" y="314" text-anchor="middle" font-size="10.5" fill="#64748b">exam week</text><rect x="278.3" y="169.8" width="34.0" height="119.0" fill="#0f766e" rx="1.5" opacity="0.92"><title>exam week | profit per hour = 198</title></rect><text x="345.8" y="314" text-anchor="middle" font-size="10.5" fill="#64748b">flagship five </text><rect x="328.8" y="126.7" width="34.0" height="162.0" fill="#0f766e" rx="1.5" opacity="0.92"><title>flagship five  | profit per hour = 270</title></rect><text x="396.2" y="314" text-anchor="middle" font-size="10.5" fill="#64748b">ice cream bott</text><rect x="379.3" y="178.5" width="34.0" height="110.3" fill="#0f766e" rx="1.5" opacity="0.92"><title>ice cream bott | profit per hour = 184</title></rect><text x="446.8" y="314" text-anchor="middle" font-size="10.5" fill="#64748b">inventory gene</text><rect x="429.8" y="219.0" width="34.0" height="69.8" fill="#0f766e" rx="1.5" opacity="0.92"><title>inventory gene | profit per hour = 116</title></rect><text x="497.2" y="314" text-anchor="middle" font-size="10.5" fill="#64748b">inventory lean</text><rect x="480.3" y="201.8" width="34.0" height="87.0" fill="#0f766e" rx="1.5" opacity="0.92"><title>inventory lean | profit per hour = 145</title></rect><text x="547.8" y="314" text-anchor="middle" font-size="10.5" fill="#64748b">late night stu</text><rect x="530.8" y="251.1" width="34.0" height="37.6" fill="#0f766e" rx="1.5" opacity="0.92"><title>late night stu | profit per hour = 63</title></rect><text x="598.2" y="314" text-anchor="middle" font-size="10.5" fill="#64748b">mall weekend</text><rect x="581.3" y="136.1" width="34.0" height="152.7" fill="#0f766e" rx="1.5" opacity="0.92"><title>mall weekend | profit per hour = 254</title></rect><text x="648.8" y="314" text-anchor="middle" font-size="10.5" fill="#64748b">network tea bo</text><rect x="631.8" y="256.7" width="34.0" height="32.1" fill="#0f766e" rx="1.5" opacity="0.92"><title>network tea bo | profit per hour = 53</title></rect><text x="699.2" y="314" text-anchor="middle" font-size="10.5" fill="#64748b">peak pricing</text><rect x="682.3" y="88.1" width="34.0" height="200.7" fill="#0f766e" rx="1.5" opacity="0.92"><title>peak pricing | profit per hour = 334</title></rect><text x="749.8" y="314" text-anchor="middle" font-size="10.5" fill="#64748b">rainy delivery</text><rect x="732.8" y="121.6" width="34.0" height="167.2" fill="#0f766e" rx="1.5" opacity="0.92"><title>rainy delivery | profit per hour = 278</title></rect><text x="800.2" y="314" text-anchor="middle" font-size="10.5" fill="#64748b">strict sla fai</text><rect x="783.3" y="203.0" width="34.0" height="85.8" fill="#0f766e" rx="1.5" opacity="0.92"><title>strict sla fai | profit per hour = 143</title></rect><text x="850.8" y="314" text-anchor="middle" font-size="10.5" fill="#64748b">tiny two staff</text><rect x="833.8" y="238.8" width="34.0" height="50.0" fill="#0f766e" rx="1.5" opacity="0.92"><title>tiny two staff | profit per hour = 83</title></rect><rect x="68.0" y="45" width="10" height="10" rx="2" fill="#0f766e"/><text x="82.0" y="54" font-size="10.5" fill="#0f172a">profit per hour</text></svg>
