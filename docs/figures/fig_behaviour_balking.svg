<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="100%" role="img" aria-label="Profit by balking threshold and load" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif"><rect x="0" y="0" width="760" height="340" fill="#ffffff"/><text x="68" y="22" font-size="14.5" font-weight="650" fill="#0f172a">Balking rule: refusing the longest queue can raise profit</text><line x1="68" y1="269.4" x2="736" y2="269.4" stroke="#e2e8f0" stroke-width="1"/><text x="59" y="273.4" text-anchor="end" font-size="11" fill="#64748b">0</text><line x1="68" y1="209.6" x2="736" y2="209.6" stroke="#e2e8f0" stroke-width="1"/><text x="59" y="213.6" text-anchor="end" font-size="11" fill="#64748b">100</text><line x1="68" y1="149.8" x2="736" y2="149.8" stroke="#e2e8f0" stroke-width="1"/><text x="59" y="153.8" text-anchor="end" font-size="11" fill="#64748b">200</text><line x1="68" y1="89.9" x2="736" y2="89.9" stroke="#e2e8f0" stroke-width="1"/><text x="59" y="93.9" text-anchor="end" font-size="11" fill="#64748b">300</text><line x1="68" y1="64" x2="68" y2="276" stroke="#94a3b8" stroke-width="1"/><line x1="68" y1="269.4" x2="736" y2="269.4" stroke="#94a3b8" stroke-width="1.2"/><text transform="translate(16,170.0) rotate(-90)" text-anchor="middle" font-size="12" fill="#0f172a">Profit per hour</text><text x="68" y="334" font-size="10.5" fill="#64748b">customer leaves at arrival if the estimated wait exceeds the threshold; synchro + FCFS, 3 clerks</text><text x="134.8" y="294" text-anchor="middle" font-size="10.5" fill="#64748b">off</text><rect x="87.9" y="116.4" width="45.7" height="153.0" fill="#0284c7" rx="1.5" opacity="0.92"><title>off | λ = 1 = 256</title></rect><rect x="136.0" y="106.1" width="45.7" height="163.3" fill="#0d9488" rx="1.5" opacity="0.92"><title>off | λ = 1.25 = 273</title></rect><text x="268.4" y="294" text-anchor="middle" font-size="10.5" fill="#64748b">3 min</text><rect x="221.5" y="132.7" width="45.7" height="136.7" fill="#0284c7" rx="1.5" opacity="0.92"><title>3 min | λ = 1 = 229</title></rect><rect x="269.6" y="106.4" width="45.7" height="163.0" fill="#0d9488" rx="1.5" opacity="0.92"><title>3 min | λ = 1.25 = 273</title></rect><text x="402.0" y="294" text-anchor="middle" font-size="10.5" fill="#64748b">5 min</text><rect x="355.1" y="116.9" width="45.7" height="152.5" fill="#0284c7" rx="1.5" opacity="0.92"><title>5 min | λ = 1 = 255</title></rect><rect x="403.2" y="86.0" width="45.7" height="183.4" fill="#0d9488" rx="1.5" opacity="0.92"><title>5 min | λ = 1.25 = 307</title></rect><text x="535.6" y="294" text-anchor="middle" font-size="10.5" fill="#64748b">8 min</text><rect x="488.7" y="116.1" width="45.7" height="153.3" fill="#0284c7" rx="1.5" opacity="0.92"><title>8 min | λ = 1 = 256</title></rect><rect x="536.8" y="90.4" width="45.7" height="179.0" fill="#0d9488" rx="1.5" opacity="0.92"><title>8 min | λ = 1.25 = 299</title></rect><text x="669.2" y="294" text-anchor="middle" font-size="10.5" fill="#64748b">10 min</text><rect x="622.3" y="116.3" width="45.7" height="153.1" fill="#0284c7" rx="1.5" opacity="0.92"><title>10 min | λ = 1 = 256</title></rect><rect x="670.4" y="95.6" width="45.7" height="173.8" fill="#0d9488" rx="1.5" opacity="0.92"><title>10 min | λ = 1.25 = 290</title></rect><rect x="68.0" y="45" width="10" height="10" rx="2" fill="#0284c7"/><text x="82.0" y="54" font-size="10.5" fill="#0f172a">λ = 1</text><rect x="113.0" y="45" width="10" height="10" rx="2" fill="#0d9488"/><text x="127.0" y="54" font-size="10.5" fill="#0f172a">λ = 1.25</text></svg>