<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 268" width="100%" role="img" aria-label="Process flow of the simulated shop" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif"><rect width="820" height="268" fill="#ffffff"/><rect x="14" y="34" width="168" height="70" rx="9" fill="#eef2ff" stroke="#94a3b8"/><text x="98.0" y="56.0" text-anchor="middle" font-size="12" font-weight="650" fill="#0f172a">Poisson arrivals</text><text x="98.0" y="71.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#64748b">λ = 0.30-1.30</text><text x="98.0" y="86.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#64748b">customers / min</text><rect x="212" y="34" width="186" height="70" rx="9" fill="#eef2ff" stroke="#94a3b8"/><text x="305.0" y="56.0" text-anchor="middle" font-size="12" font-weight="650" fill="#0f172a">Order class</text><text x="305.0" y="71.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#64748b">55% tea | 20% bread</text><text x="305.0" y="86.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#64748b">5% ice | 20% mixed</text><rect x="428" y="34" width="176" height="70" rx="9" fill="#f1f5f9" stroke="#94a3b8"/><text x="516.0" y="56.0" text-anchor="middle" font-size="12" font-weight="650" fill="#0f172a">One shared queue</text><text x="516.0" y="71.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#64748b">priority: fast items</text><text x="516.0" y="86.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#64748b">FCFS within class</text><rect x="634" y="34" width="172" height="70" rx="9" fill="#ecfdf5" stroke="#94a3b8"/><text x="720.0" y="56.0" text-anchor="middle" font-size="12" font-weight="650" fill="#0f172a">Clerk pool</text><text x="720.0" y="71.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#64748b">m = 1..5 cross-trained</text><text x="720.0" y="86.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#64748b">one job at a time</text><line x1="182" y1="69" x2="205" y2="69" stroke="#475569" stroke-width="1.6"/><polygon points="205,65 212,69 205,73" fill="#475569"/><line x1="398" y1="69" x2="421" y2="69" stroke="#475569" stroke-width="1.6"/><polygon points="421,65 428,69 421,73" fill="#475569"/><line x1="604" y1="69" x2="627" y2="69" stroke="#475569" stroke-width="1.6"/><polygon points="627,65 634,69 627,73" fill="#475569"/><text x="14" y="148" font-size="12" font-weight="650" fill="#0f172a">Job decomposition (a job is one uninterruptible block of clerk time)</text><rect x="14" y="160" width="186" height="76" rx="9" fill="#fffbeb" stroke="#94a3b8"/><text x="107.0" y="182.0" text-anchor="middle" font-size="12" font-weight="650" fill="#0f172a">Tea only</text><text x="107.0" y="197.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#64748b">0.5 + 2.0 = 2.500 min</text><text x="107.0" y="212.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#64748b">1 job</text><rect x="212" y="160" width="186" height="76" rx="9" fill="#fffbeb" stroke="#94a3b8"/><text x="305.0" y="182.0" text-anchor="middle" font-size="12" font-weight="650" fill="#0f172a">Bread only</text><text x="305.0" y="197.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#64748b">0.5 + 0.167 = 0.667 min</text><text x="305.0" y="212.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#64748b">1 job</text><rect x="410" y="160" width="186" height="76" rx="9" fill="#fffbeb" stroke="#94a3b8"/><text x="503.0" y="182.0" text-anchor="middle" font-size="12" font-weight="650" fill="#0f172a">Ice cream only</text><text x="503.0" y="197.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#64748b">0.5 + 0.333 = 0.833 min</text><text x="503.0" y="212.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#64748b">1 job</text><rect x="608" y="160" width="198" height="76" rx="9" fill="#fef2f2" stroke="#94a3b8"/><text x="707.0" y="182.0" text-anchor="middle" font-size="12" font-weight="650" fill="#0f172a">Mixed order</text><text x="707.0" y="197.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#64748b">sync: 1 × 2.833 min</text><text x="707.0" y="212.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#64748b">split: 0.833 + 2.000 min</text><text x="707.0" y="227.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#64748b">same total work</text><text x="14" y="258" font-size="10.5" fill="#64748b">Both delivery modes consume 2.833 clerk-minutes per mixed order, so the two policies are workload-identical (capacity, not policy, sets throughput).</text></svg>