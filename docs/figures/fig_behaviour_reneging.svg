<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="100%" role="img" aria-label="Profit by reneging threshold and load" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif"><rect x="0" y="0" width="760" height="340" fill="#ffffff"/><text x="68" y="22" font-size="14.5" font-weight="650" fill="#0f172a">Reneging rule: trimming the tail of the wait distribution</text><line x1="68" y1="269.4" x2="736" y2="269.4" stroke="#e2e8f0" stroke-width="1"/><text x="59" y="273.4" text-anchor="end" font-size="11" fill="#64748b">0</text><line x1="68" y1="205.0" x2="736" y2="205.0" stroke="#e2e8f0" stroke-width="1"/><text x="59" y="209.0" text-anchor="end" font-size="11" fill="#64748b">100</text><line x1="68" y1="140.5" x2="736" y2="140.5" stroke="#e2e8f0" stroke-width="1"/><text x="59" y="144.5" text-anchor="end" font-size="11" fill="#64748b">200</text><line x1="68" y1="76.1" x2="736" y2="76.1" stroke="#e2e8f0" stroke-width="1"/><text x="59" y="80.1" text-anchor="end" font-size="11" fill="#64748b">300</text><line x1="68" y1="64" x2="68" y2="276" stroke="#94a3b8" stroke-width="1"/><line x1="68" y1="269.4" x2="736" y2="269.4" stroke="#94a3b8" stroke-width="1.2"/><text transform="translate(16,170.0) rotate(-90)" text-anchor="middle" font-size="12" fill="#0f172a">Profit per hour</text><text x="68" y="334" font-size="10.5" fill="#64748b">customer leaves if service has not started within the threshold; synchro + FCFS, 3 clerks</text><text x="151.5" y="294" text-anchor="middle" font-size="10.5" fill="#64748b">off</text><rect x="92.6" y="104.6" width="57.7" height="164.8" fill="#0284c7" rx="1.5" opacity="0.92"><title>off | λ = 1 = 256</title></rect><rect x="152.7" y="93.5" width="57.7" height="175.9" fill="#0d9488" rx="1.5" opacity="0.92"><title>off | λ = 1.25 = 273</title></rect><text x="318.5" y="294" text-anchor="middle" font-size="10.5" fill="#64748b">10 min</text><rect x="259.6" y="104.5" width="57.7" height="164.9" fill="#0284c7" rx