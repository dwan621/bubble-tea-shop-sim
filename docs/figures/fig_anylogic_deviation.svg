<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="100%" role="img" aria-label="Deviation of the Python reimplementation from the archive" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif"><rect x="0" y="0" width="760" height="340" fill="#ffffff"/><text x="68" y="22" font-size="14.5" font-weight="650" fill="#0f172a">Deviation of the re-implementation, and why averaging matters</text><line x1="68" y1="247.4" x2="736" y2="247.4" stroke="#e2e8f0" stroke-width="1"/><text x="59" y="251.4" text-anchor="end" font-size="11" fill="#64748b">-8.00</text><line x1="68" y1="193.3" x2="736" y2="193.3" stroke="#e2e8f0" stroke-width="1"/><text x="59" y="197.3" text-anchor="end" font-size="11" fill="#64748b">-4.00</text><line x1="68" y1="139.2" x2="736" y2="139.2" stroke="#e2e8f0" stroke-width="1"/><text x="59" y="143.2" text-anchor="end" font-size="11" fill="#64748b">0</text><line x1="68" y1="85.0" x2="736" y2="85.0" stroke="#e2e8f0" stroke-width="1"/><text x="59" y="89.0" text-anchor="end" font-size="11" fill="#64748b">4.00</text><line x1="68" y1="64" x2="68" y2="276" stroke="#94a3b8" stroke-width="1"/><line x1="68" y1="139.2" x2="736" y2="139.2" stroke="#94a3b8" stroke-width="1.2"/><text transform="translate(16,170.0) rotate(-90)" text-anchor="middle" font-size="12" fill="#0f172a">Profit deviation vs archive (%, + = Python higher)</text><text x="68" y="334" font-size="10.5" fill="#64748b">the acceptance band is ±5% at λ = 1.00 and ±12% at λ = 1.25; the signed deviation exposes the high-load bias</text><text x="123.7" y="294" text-anchor="middle" font-size="10.5" fill="#64748b">E1</text><rect x="84.8" y="92.6" width="37.7" height="46.6" fill="#0d9488" rx="1.5" opacity="0.92"><title>E1 | 200-rep mean vs archive = 3.44</title></rect><rect x="124.9" y="84.5" width="37.7" height="54.7" fill="#94a3b8" rx="1.5" opacity="0.92"><title>E1 | single run vs archive = 4.04</title></rect><text x="235.0" y="294" text-anchor="middle" font-s